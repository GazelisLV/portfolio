<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaidot dzimšanas dienu..</title>
</head>
<body>
    <hr>
    
        <p>Ievadi pilnu datumu, kad Tev būs tuvākā dzimšanas diena</p>
        <p>Gads <input type="number" name="gads" id="year"></p>
        <p>Mēnesis <input type="number" name="menesis" id="month"></p>
        <p>Diena <input type="number" name="diena" id="day"></p>
        <p>Aprēķināt dienu skaitu līdz dzimšanas dienai <button onclick="dienas()">Spied</button></p>
        <p>Līdz svētkiem atlikušas <input type="value" name="dienas" id="dienas">dienas : ))</p>
        <script> 
            function dienas() {

    const year = document.getElementById("year").value;
    const month = document.getElementById("month").value ; 
    const day = document.getElementById("day").value;

  
  const target = new Date(year, month - 1, day);
    const today = new Date();

    const diffInDays = target - today;
    const diffDays = Math.ceil(diffInDays / (1000 * 60 * 60 * 24));

    document.getElementById("dienas").value = 
     diffDays >= 0
        ? diffDays
        : "Jau bijusi";
            }
        </script>
    
</body>
</html>
